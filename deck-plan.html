<!doctype html>
<link rel="stylesheet" href="cruise-theme.css">
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Disney Adventure · 덱 플랜</title>
  <style>
    :root{--navy:#102c5b;--gold:#e1ac25;--line:#dce4ee;--muted:#64738d}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#13233e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:430px;min-height:100vh;margin:auto;background:#fff}.top{height:62px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:5}.back{color:#fff;text-decoration:none;font-size:25px}.top h1{font-size:18px;margin:0}.search{padding:11px 14px 8px;background:#fff;border-bottom:1px solid var(--line)}.search label{display:block;color:#315a8e;font-size:11px;font-weight:800;margin-bottom:5px}.row{display:flex;gap:7px}.row input{flex:1;min-width:0;height:38px;border:1px solid #b7cee6;border-radius:8px;padding:0 10px;font-size:14px}.row button{border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;padding:0 13px}.state{font-size:11px;color:#52657d;margin:6px 2px 0}.titlebar{background:var(--navy);color:#fff;padding:7px 14px;font-size:12px;font-weight:800}.map{height:500px;overflow:auto;background:#d5d5d5;border-bottom:1px solid var(--line)}.canvas{position:relative;width:100%;min-height:100%}.canvas img{display:block;width:100%;height:auto;min-height:100%}.marker{position:absolute;display:none;width:24px;height:24px;border:2px solid #f15b42;border-radius:50%;background:rgba(241,91,66,.25);box-shadow:0 0 0 2px #fff,0 2px 7px #263e67;transform:translate(-50%,-50%);z-index:2;color:#fff;font-weight:900;text-align:center;line-height:20px}.tag{position:absolute;display:none;z-index:3;transform:translate(-50%,-135%);background:#102c5b;color:#fff;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}.hint{font-size:10px;color:#748199;margin:7px 14px}.list{display:grid;gap:5px;padding:8px;background:#f3f6fa}.deck{border:0;background:#fff;border-radius:9px;padding:7px 9px;display:flex;gap:8px;align-items:center;text-align:left;color:#13233e}.deck.active{background:var(--gold)}.num{width:28px;height:28px;border-radius:7px;background:#eaf0f6;display:grid;place-items:center;font-size:12px;font-weight:900}.deck.active .num{background:#104261;color:#fff}.copy{min-width:0;flex:1}.name{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{display:block;font-size:10px;color:#6a778b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deck.active .detail{color:#554824}.arrow{font-size:18px;color:#98a5b4}.deck.active .arrow{color:#394450}
  </style>
</head>
<body><div class="page">
  <header class="top"><a class="back" onclick="if(history.length>1){history.back();return false}" href="disney-adventure-singapore-guide.html" aria-label="홈으로">‹</a><h1>덱 플랜</h1></header>
  <section class="search"><label for="query">객실 번호 또는 주요 시설 검색</label><div class="row"><input id="query" placeholder="예: 10753 · Infinity Pool"><button id="find">찾기</button></div><div id="state" class="state">객실 번호 또는 시설명을 입력하세요.</div></section>
  <div id="title" class="titlebar">Deck 10 · Imagination Garden & Dining</div><div id="map" class="map"><div class="canvas"><img id="image" alt="덱 플랜"><i id="marker" class="marker">+</i><b id="tag" class="tag"></b></div></div><p class="hint">표식은 덱 플랜 이미지에서 OCR로 추출한 실제 객실 번호·시설명 좌표를 기준으로 표시됩니다.</p>
  <div id="list" class="list" aria-label="덱 선택"></div>
</div>
<script src="deck-text-index.js"></script>
<script>
const decks=[5,6,7,8,9,10,11,12,13,15,16,17,18,19];let current=10;
const info={5:['Dining & Shopping','Animator’s Palate · World of Disney · Tiana’s Bayou Lounge'],6:['Theatre & Guest Services','Walt Disney Theatre · Guest Services'],7:['San Fransokyo Street','Big Hero Arcade · Baymax Treats'],8:['Kids Clubs & Dining','Oceaneer Club · Hollywood Spotlight Club'],9:['Health & Staterooms','Health Center · Staterooms'],10:['Imagination Garden & Dining','Imagination Garden · Wayfinder Bay · Spa'],11:['Imagination Garden Upper','Garden Bar · Castle Collection'],12:['Adventure Activities','야외 액티비티 · 가족 공간'],13:['Adventure Activities','엔터테인먼트 · 전망 공간'],15:['Adventure Activities','레저 · 전망 공간'],16:['Adventure Activities','레저 · 전망 공간'],17:['Adventure Activities','레저 · 전망 공간'],18:['Marvel Landing','Infinity Pool · Concierge Spa'],19:['Adventure Activities','야외 휴식 · 전망 공간']};
const aliases={'오셔니어 클럽':'oceaneer','oceaneer club':'oceaneer','인피니티 풀':'infinity pool','스파':'spa','피트니스':'fitness','극장':'walt disney theatre','월트 디즈니 시어터':'walt disney theatre','애니메이터 팔레트':'animators palate','티아나':'tianas bayou','이매지네이션 가든':'imagination garden'};
const query=document.getElementById('query'),findButton=document.getElementById('find'),state=document.getElementById('state'),title=document.getElementById('title'),image=document.getElementById('image'),map=document.getElementById('map'),marker=document.getElementById('marker'),tag=document.getElementById('tag');
const norm=v=>v.toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
const specialPlaces={wayfinderbay:{t:'Wayfinder Bay',deck:10,x:31.5,y:94.4},marvellanding:{t:'Marvel Landing',deck:18,x:21,y:84.5},wayfinderbeach:{t:'Wayfinder Beach',deck:10,x:31.5,y:94.4},baymaxcinemas:{t:'Baymax Cinemas',deck:7,x:32.3,y:95},sunnysidefamilypool:{t:'Sunnyside Family Pool',deck:17,x:20.8,y:39.7},woodyandjessieswildslides:{t:"Woody and Jessie's Wild Slides",deck:17,x:73.2,y:36.1},flyingsaucersplashzone:{t:'Flying Saucer Splash Zone',deck:17,x:74.3,y:42.6},toystorysplashpad:{t:'Toy Story Splash Pad',deck:17,x:49.8,y:48.2},infinitypool:{t:'Infinity Pool',deck:18,x:50,y:98.6},infiniteblissspa:{t:'Infinite Bliss Spa - Elemis at Sea',deck:10,x:32.5,y:38.7},opulencespa:{t:'Opulence Spa - Elemis at Sea',deck:18,x:31.8,y:12.5},fitnesscenter:{t:'Fitness Center',deck:10,x:81,y:38.9},conciergefitnesscenter:{t:'Concierge Fitness Center',deck:18,x:50.5,y:22.1},runningtrack:{t:'Running Track',deck:18,x:5.1,y:40.4},gardenstage:{t:'Garden Stage',deck:10,x:50,y:52.2},bibbidibobbidiboutique:{t:'Bibbidi Bobbidi Boutique',deck:7,x:24.6,y:45.6},marvelstylestudio:{t:'Marvel Style Studio',deck:6,x:91.5,y:71.5},itsasmallworldnursery:{t:"it's a small world Nursery",deck:8,x:40.6,y:32.6},disneysoceaneerclub:{t:"Disney's Oceaneer Club",deck:8,x:50.9,y:45.7},vibe:{t:'Vibe',deck:7,x:31.4,y:82.1},edge:{t:'Edge',deck:7,x:32.3,y:77.1},bigheroarcade:{t:'Big Hero Arcade',deck:7,x:68.6,y:80.2},dlounge:{t:'D Lounge',deck:7,x:70,y:45.3},buccaneerbar:{t:'Buccaneer Bar',deck:6,x:9.2,y:71.2},townsquare:{t:'Town Square',deck:6,x:40,y:56.7},animatorspalate:{t:"Animator's Palate",deck:5,x:50,y:78.8}};
function locate(value){let q=norm(value);q=norm(aliases[value.trim()]||q);if(!q)return null;for(const [deck,items] of Object.entries(window.deckTextIndex||{})){const x=items.find(i=>norm(i.t)===q);if(x)return {...x,deck:+deck}}for(const [deck,items] of Object.entries(window.deckTextIndex||{})){const x=items.find(i=>norm(i.t).includes(q));if(x)return {...x,deck:+deck}}return specialPlaces[q]||null}
function render(){const found=locate(query.value),d=info[current],list=document.getElementById('list');title.textContent=`Deck ${current} · ${d[0]}`;image.src=`deck-plans/deck_${String(current).padStart(2,'0')}.webp`;list.innerHTML=[...decks].reverse().map(deck=>`<button class="deck ${deck===current?'active':''}" data-deck="${deck}"><span class="num">${deck}</span><span class="copy"><span class="name">Deck ${deck} · ${info[deck][0]}</span><span class="detail">${info[deck][1]}</span></span><span class="arrow">›</span></button>`).join('');list.onclick=e=>{const b=e.target.closest('[data-deck]');if(b){current=+b.dataset.deck;render();map.scrollTop=0}};marker.style.display=tag.style.display='none';if(found){state.textContent=`${found.t} · Deck ${found.deck}의 이미지 표기 위치입니다.`;if(found.deck===current){marker.style.left=tag.style.left=found.x+'%';marker.style.top=tag.style.top=found.y+'%';tag.textContent=found.t;marker.style.display=tag.style.display='block';requestAnimationFrame(()=>map.scrollTop=Math.max(0,document.querySelector('.canvas').offsetHeight*found.y/100-map.clientHeight*.35))}}else if(query.value.trim())state.textContent='이미지에서 찾지 못했습니다. 객실 번호 또는 시설명을 다시 입력해 주세요.';else state.textContent='객실 번호 또는 시설명을 입력하세요.'}
findButton.onclick=()=>{const found=locate(query.value);if(found){current=found.deck;render()}else render()};query.addEventListener('input',()=>{const found=locate(query.value);if(found){current=found.deck;render()}});query.addEventListener('keydown',e=>{if(e.key==='Enter')findButton.click()});const incomingQuery=new URLSearchParams(location.search).get('q');if(incomingQuery){query.value=incomingQuery;const found=locate(incomingQuery);if(found)current=found.deck}render();
</script></body></html>
