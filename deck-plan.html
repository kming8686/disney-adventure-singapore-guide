<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disney Adventure · 덱 플랜</title>
<link rel="stylesheet" href="cruise-theme.css">
<style>
:root{--navy:#102c5b;--gold:#e1ac25;--line:#dce4ee}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#13233e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:430px;min-height:100vh;margin:auto;background:#fff}.top{height:62px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:5}.back{color:#fff;text-decoration:none;font-size:25px}.top h1{font-size:18px;margin:0}.search{padding:11px 14px 8px;border-bottom:1px solid var(--line)}.search label{display:block;color:#315a8e;font-size:11px;font-weight:800;margin-bottom:5px}.row{display:flex;gap:7px}.row input{flex:1;min-width:0;height:38px;border:1px solid #b7cee6;border-radius:8px;padding:0 10px;font-size:14px}.row button{border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;padding:0 13px}.state{font-size:11px;color:#52657d;margin:6px 2px 0}.titlebar{background:var(--navy);color:#fff;padding:7px 14px;font-size:12px;font-weight:800}.map{height:500px;overflow:auto;background:#d5d5d5;border-bottom:1px solid var(--line);scroll-behavior:smooth}.canvas{position:relative;width:100%;min-height:100%}.canvas img{display:block;width:100%;height:auto;min-height:100%}.marker{position:absolute;display:none;width:24px;height:24px;border:2px solid #f15b42;border-radius:50%;background:rgba(241,91,66,.25);box-shadow:0 0 0 2px #fff,0 2px 7px #263e67;transform:translate(-50%,-50%);z-index:2;color:#fff;font-weight:900;text-align:center;line-height:20px}.tag{position:absolute;display:none;z-index:3;transform:translate(-50%,-135%);background:#102c5b;color:#fff;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}.hint{font-size:10px;color:#748199;margin:7px 14px}.list{display:grid;gap:5px;padding:8px;background:#f3f6fa}.deck{border:0;background:#fff;border-radius:9px;padding:7px 9px;display:flex;gap:8px;align-items:center;text-align:left;color:#13233e}.deck.active{background:var(--gold)}.num{width:28px;height:28px;border-radius:7px;background:#eaf0f6;display:grid;place-items:center;font-size:12px;font-weight:900}.deck.active .num{background:#104261;color:#fff}.copy{min-width:0;flex:1}.name{display:block;font-size:12px;font-weight:800}.detail{display:block;font-size:10px;color:#6a778b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{margin-left:auto;font-size:18px}
</style>
</head>
<body><div class="page">
<header class="top"><a class="back" onclick="if(history.length>1){history.back();return false}" href="disney-adventure-singapore-guide.html">‹</a><h1>덱 플랜</h1></header>
<section class="search"><label for="query">객실 번호 또는 주요 시설 검색</label><div class="row"><input id="query" placeholder="예: 10753 · Infinity Pool"><button id="find">찾기</button></div><div id="state" class="state">객실 번호 또는 시설명을 입력하세요.</div></section>
<div id="title" class="titlebar"></div><div id="map" class="map"><div class="canvas"><img id="image" alt="덱 플랜"><i id="marker" class="marker">+</i><b id="tag" class="tag"></b></div></div><p class="hint">장소핀을 누르면 해당 덱과 실제 위치가 화면 중앙에 표시됩니다.</p><div id="list" class="list"></div>
</div>
<script src="deck-text-index.js"></script>
<script>
const decks=[5,6,7,8,9,10,11,12,13,15,16,17,18,19];let current=10;
const info={5:['Dining & Shopping','Animator’s Palate · World of Disney · Tiana’s Bayou Lounge'],6:['Theatre & Guest Services','Walt Disney Theatre · Enchanted Summer · Navigator’s Club'],7:['San Fransokyo Street','Big Hero Arcade · Baymax Cinemas · D Lounge'],8:['Kids Clubs & Dining','Oceaneer Club · Hollywood Spotlight Club'],9:['Health & Staterooms','Medical Center · Animator’s Table'],10:['Imagination Garden & Dining','Garden Stage · Wayfinder Bay · Spa'],11:['Imagination Garden Upper','Garden Bar · Castle Collection'],12:['Adventure Activities','가족 공간'],13:['Adventure Activities','전망 공간'],15:['Adventure Activities','레저 공간'],16:['Adventure Activities','레저 공간'],17:['Pools & Pixar Market','Toy Story Place · Pixar Market'],18:['Marvel Landing','Infinity Pool · Concierge Spa'],19:['Adventure Activities','야외 휴식 공간']};
const norm=v=>(v||'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
const aliases={
'오셔니어 클럽':'disneys oceaneer club','oceaneer club':'disneys oceaneer club','인피니티 풀':'infinity pool','스파':'infinite bliss spa','피트니스':'fitness center','극장':'walt disney theatre','월트 디즈니 시어터':'walt disney theatre','애니메이터 팔레트':'animators palate','애니메이터 테이블':'animators table','티아나':'tianas bayou lounge','이매지네이션 가든':'imagination garden','가든 스테이지':'garden stage','웨이파인더 베이':'wayfinder bay','픽사 마켓':'pixar market','할리우드 스포트라이트':'hollywood spotlight club','네비게이터 클럽':'navigators club','인챈티드 서머':'enchanted summer','토이 스토리 플레이스':'toy story place'};
const places=[
['Walt Disney Theatre',5,49.5,23],['Animator’s Palate',5,50,78.8],['Tiana’s Bayou Lounge',5,51.7,47.3],['World of Disney',5,24.5,47.2],
['Enchanted Summer',6,47.6,43.9],['Navigator’s Club',6,50.4,78.2],['Buccaneer Bar',6,9.2,71.2],['Town Square',6,40,56.7],['Marvel Style Studio',6,91.5,71.5],
['Bibbidi Bobbidi Boutique',7,24.6,45.6],['D Lounge',7,70,45.3],['Big Hero Arcade',7,68.6,80.2],['Vibe',7,31.4,82.1],['Edge',7,32.3,77.1],['Baymax Cinemas',7,32.3,95],['Bacha Coffee',7,27.6,57.4],['TWG Tea',7,27.7,59.9],
["Disney’s Oceaneer Club",8,50.9,45.7],["it’s a small world Nursery",8,40.6,32.6],['Hollywood Spotlight Club',8,49.3,96.2],['Marvel WEB Workshop',8,43.6,60.8],['Fairytale Hall',8,61.5,60.4],
['Medical Center',9,50.3,24.2],["Animator’s Table",9,64.7,77],
['Infinite Bliss Spa',10,32.5,38.7],['Fitness Center',10,81,38.9],['Imagination Garden',10,50.2,56.1],['Garden Stage',10,50,52.2],['Wayfinder Bay',10,32.5,95.4],['Wayfinder Bar',10,50.1,93],['Mike & Sulley’s Flavors of Asia',10,20.7,88.9],['Palo Cafe',10,57.9,85.7],['Palo Trattoria',10,80.3,89.9],
['Castle Collection',11,49.5,35.1],['Garden Bar',11,50.4,38.2],['Disney Imagination Garden',11,50,54.8],['Disney Discovery Reef',11,59,79.5],['Taverna Portorosso',11,59.1,87.5],
['Toy Story Place',17,22.5,56.2],['Sunnyside Family Pool',17,20.8,39.7],["Woody and Jessie’s Wild Slides",17,73.2,36.1],['Flying Saucer Splash Zone',17,74.3,42.6],['Toy Story Splash Pad',17,49.8,48.2],['Pixar Market',17,23,81],
['Opulence Spa',18,31.8,12.5],['Concierge Fitness Center',18,50.5,22.1],['Running Track',18,5.1,40.4],['Marvel Landing',18,21,84.5],['Infinity Pool',18,50,98.6],['Infinity Bar',18,50.4,93.7]
].map(([t,deck,x,y])=>({t,deck,x,y,key:norm(t)}));
const query=document.getElementById('query'),findButton=document.getElementById('find'),state=document.getElementById('state'),title=document.getElementById('title'),image=document.getElementById('image'),map=document.getElementById('map'),marker=document.getElementById('marker'),tag=document.getElementById('tag');
function joinedIndexMatch(q){for(const [deck,items] of Object.entries(window.deckTextIndex||{})){for(let i=0;i<items.length;i++){let text='';for(let j=i;j<Math.min(items.length,i+4);j++){if(j>i&&Math.abs(items[j].y-items[i].y)>2.2)break;text+=items[j].t;const n=norm(text);if(n===q||n.includes(q)||q.includes(n)&&n.length>5){const group=items.slice(i,j+1);return {t:group.map(v=>v.t).join(' '),deck:+deck,x:group.reduce((s,v)=>s+v.x,0)/group.length,y:group.reduce((s,v)=>s+v.y,0)/group.length}}}}}return null}
function locate(value){let raw=(value||'').trim();let q=norm(aliases[raw.toLowerCase()]||raw);if(!q)return null;const known=places.find(p=>p.key===q)||places.find(p=>p.key.includes(q)||q.includes(p.key));if(known)return known;for(const [deck,items] of Object.entries(window.deckTextIndex||{})){const exact=items.find(i=>norm(i.t)===q);if(exact)return {...exact,deck:+deck}}const joined=joinedIndexMatch(q);if(joined)return joined;for(const [deck,items] of Object.entries(window.deckTextIndex||{})){const partial=items.find(i=>norm(i.t).includes(q));if(partial)return {...partial,deck:+deck}}return null}
function focus(found){if(!found||found.deck!==current)return;marker.style.left=tag.style.left=found.x+'%';marker.style.top=tag.style.top=found.y+'%';tag.textContent=found.t;marker.style.display=tag.style.display='block';const place=()=>{const canvas=document.querySelector('.canvas');const y=canvas.scrollHeight*found.y/100;map.scrollTop=Math.max(0,y-map.clientHeight/2)};if(image.complete&&image.naturalHeight)requestAnimationFrame(place);else image.addEventListener('load',()=>requestAnimationFrame(place),{once:true})}
function render(){const found=locate(query.value),d=info[current],list=document.getElementById('list');title.textContent=`Deck ${current} · ${d[0]}`;image.src=`deck-plans/deck_${String(current).padStart(2,'0')}.webp`;list.innerHTML=[...decks].reverse().map(deck=>`<button class="deck ${deck===current?'active':''}" data-deck="${deck}"><span class="num">${deck}</span><span class="copy"><span class="name">Deck ${deck} · ${info[deck][0]}</span><span class="detail">${info[deck][1]}</span></span><span class="arrow">›</span></button>`).join('');list.onclick=e=>{const b=e.target.closest('[data-deck]');if(b){current=+b.dataset.deck;render();map.scrollTop=0}};marker.style.display=tag.style.display='none';if(found){state.textContent=`${found.t} · Deck ${found.deck}의 실제 위치입니다.`;focus(found)}else if(query.value.trim())state.textContent='위치를 찾지 못했습니다. 시설명을 다시 확인해 주세요.';else state.textContent='객실 번호 또는 시설명을 입력하세요.'}
function go(){const found=locate(query.value);if(found)current=found.deck;render()}
findButton.onclick=go;query.addEventListener('keydown',e=>{if(e.key==='Enter')go()});const incoming=new URLSearchParams(location.search).get('q');if(incoming){query.value=incoming;const found=locate(incoming);if(found)current=found.deck}render();
</script></body></html>
