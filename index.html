<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>My Disney Cruise Navigator</title>
  <style>
    :root{--navy:#061e2d;--teal:#0a6476;--teal2:#0d7d8c;--gold:#f0b90b;--gold2:#ffd43b;--pale:#b7d9df;--white:#f7fbfc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#061e2d;color:var(--white)}body{display:flex;justify-content:center}.gate{position:relative;width:min(100%,520px);min-height:100vh;padding:34px 20px max(22px,env(safe-area-inset-bottom));overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(21,129,145,.34),transparent 35%),linear-gradient(180deg,#061d2b 0%,#06394a 52%,#0b7482 100%)}.gate:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.035),transparent);pointer-events:none}.top{text-align:center;position:relative;z-index:1}.arc{margin:15px auto 8px;max-width:390px;color:var(--gold);font-weight:900;line-height:1.4;transform:rotate(-2deg)}.arc strong{display:block;font-size:17px;letter-spacing:.4px}.arc span{display:block;font-size:10px;margin-top:3px}.arc .original{color:#e7c95b}.arc .custom{color:#ffd43b}.emblem{width:150px;height:150px;margin:15px auto 8px;position:relative;display:grid;place-items:center}.moon{position:absolute;inset:14px;border:3px solid #c8dfe1;border-radius:50%;box-shadow:0 0 0 7px rgba(255,255,255,.04),inset 0 0 22px rgba(240,185,11,.12)}.ship{position:absolute;width:105px;height:48px;border-radius:58% 42% 28% 24%;background:linear-gradient(#f7faf7 0 43%,#d6e5df 44% 58%,#0f314a 59% 73%,#e4b431 74% 82%,#fff 83%);transform:rotate(-5deg);box-shadow:0 7px 0 -4px #08253a}.ship:before{content:"";position:absolute;width:66px;height:23px;right:15px;top:-17px;border-radius:7px 24px 0 0;background:linear-gradient(#f5d35b 0 20%,#edf6f4 21%);box-shadow:inset 0 -7px #c9dddb}.ship:after{content:"✦  ✧  ✦";position:absolute;left:7px;top:-40px;color:#d9f0ef;font-size:14px}.waveMark{position:absolute;width:122px;height:42px;bottom:23px;border-bottom:8px double #78c9c8;border-radius:50%;transform:rotate(-6deg)}.badge{position:absolute;bottom:8px;padding:3px 12px 5px;background:#e5eadf;color:#123344;font-family:Georgia,serif;font-size:18px;font-weight:900;letter-spacing:1.5px;transform:rotate(5deg);clip-path:polygon(6% 0,94% 0,100% 75%,50% 100%,0 75%)}h1{margin:11px 0 0;color:var(--gold);font-size:21px;letter-spacing:2px}h2{margin:7px 0 0;color:#c9dce1;font-size:12px;font-weight:500;letter-spacing:8px}.sub{margin-top:20px;color:#a39d36;font-size:11px;letter-spacing:.4px}.sub:before,.sub:after{content:"";display:inline-block;width:36px;height:1px;background:#a98516;vertical-align:middle;margin:0 10px}.entry{position:relative;z-index:1;margin-top:112px;padding:18px 16px 15px;border:1px solid rgba(240,185,11,.48);border-radius:22px;background:linear-gradient(145deg,rgba(18,112,128,.55),rgba(57,133,146,.38));box-shadow:inset 0 1px rgba(255,255,255,.11),0 12px 34px rgba(0,0,0,.16)}label{display:block;text-align:center;color:var(--gold);font-size:14px;font-weight:900;margin-bottom:13px}input{width:100%;height:52px;border:1.5px solid rgba(240,185,11,.72);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;text-align:center;font-size:20px;font-weight:900;letter-spacing:4px;outline:none}input::placeholder{color:rgba(205,225,230,.42);font-size:13px;letter-spacing:3px}.row{display:grid;grid-template-columns:68px 1fr;gap:10px;margin-top:12px}.status{display:grid;place-items:center;height:51px;border:1px solid rgba(191,225,229,.42);border-radius:13px;background:rgba(255,255,255,.05);color:#d6e5e8;font-size:13px}.start{height:51px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#10251f;font-size:15px;font-weight:900;box-shadow:0 7px 18px rgba(240,185,11,.22);cursor:pointer}.error{min-height:18px;margin:8px 2px 0;text-align:center;color:#ffe3aa;font-size:11px}.foot{position:relative;z-index:1;text-align:center;margin-top:105px;color:rgba(190,222,226,.52);font-size:10px;letter-spacing:.5px}@media(max-height:760px){.gate{padding-top:18px}.entry{margin-top:65px}.foot{margin-top:55px}.emblem{width:125px;height:125px}.arc{margin-top:5px}}
  </style>
</head>
<body>
  <main class="gate">
    <section class="top">
      <div class="arc"><strong>✦ You've Been Pixie Dusted! ✦</strong><span class="original">Original by 뚱이 · Stateroom 15628</span><span class="custom">Customized by Stateroom 10753 (Jul 30, 2026)</span></div>
      <div class="emblem"><div class="moon"></div><div class="ship"></div><div class="waveMark"></div><div class="badge">NAVIGATOR</div></div>
      <h1>MY DISNEY CRUISE</h1><h2>NAVIGATOR</h2><div class="sub">✦ Disney Adventure ✦</div>
    </section>
    <section class="entry">
      <label for="room">🔑 내 방 번호를 입력하세요</label>
      <input id="room" inputmode="numeric" autocomplete="off" placeholder="예) 9542 또는 12034" maxlength="5">
      <div class="row"><div class="status" id="status">미정</div><button class="start" id="start">크루즈 탐험 시작! 🚢</button></div>
      <div class="error" id="error"></div>
    </section>
    <footer class="foot">⚓ Have a Magical Voyage! ⚓</footer>
  </main>
<script>
const room=document.getElementById('room'),status=document.getElementById('status'),error=document.getElementById('error');
const saved=localStorage.getItem('stateroomNumber');if(saved){room.value=saved;status.textContent='Deck '+saved.slice(0,-3)}
room.addEventListener('input',()=>{room.value=room.value.replace(/\D/g,'').slice(0,5);status.textContent=room.value.length>=4?'Deck '+room.value.slice(0,-3):'미정';error.textContent=''});
function enter(){const value=room.value.trim();if(value.length<4){error.textContent='객실 번호를 4~5자리 숫자로 입력해 주세요.';room.focus();return}localStorage.setItem('stateroomNumber',value);location.href='home.html'}
document.getElementById('start').addEventListener('click',enter);room.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
</script>
</body>
</html>
