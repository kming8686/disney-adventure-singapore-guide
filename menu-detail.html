<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메뉴 상세</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf5e7;color:#1c2247;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:430px;min-height:100vh;margin:auto;background:#fbf5e7}.head{padding:16px;background:#fff8e9;border-bottom:1px solid #d9cfb5}.back{color:#1c2247;text-decoration:none;font-size:24px}.head h1{font-family:Georgia,serif;font-size:23px;margin:7px 0}.sub{font-size:12px;color:#68708c}.tabs{display:flex;border-bottom:1px solid #d9cfb5;background:#fff8e9}.tabs button{flex:1;border:0;background:transparent;padding:12px;color:#405071;font-weight:900}.tabs button.active{color:#d35b34;border-bottom:3px solid #d35b34}.content{padding:14px}.section{margin:14px 0 20px}.section h2{font-size:16px;color:#c84f2d;margin:0 0 9px}.dish{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-top:1px solid #e6dcc6}.emoji{display:grid;place-items:center;width:78px;height:72px;background:#f1e6ca;border-radius:8px;font-size:30px}.name{font-size:14px;font-weight:900}.desc{font-size:11px;color:#59627b;line-height:1.5;margin-top:4px}.sig{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:6px;background:#ffc233;font-size:10px;font-weight:900}.note{padding:11px;border-radius:9px;background:#fff0d2;color:#735614;font-size:11px;line-height:1.5}</style></head><body><main class="page"><header class="head"><a class="back" onclick="if(history.length>1){history.back();return false}" href="restaurant.html">‹</a><h1 id="title">메뉴 상세</h1><div id="sub" class="sub"></div></header><nav class="tabs"><button class="active" data-tab="adult">🍽 Adult Menu</button><button data-tab="kids">🧒 Kids Menu</button></nav><div id="content" class="content"></div></main><script>const key=new URLSearchParams(location.search).get('menu')||'animators_palate',d={adult:{'Small Plates':[['🥟','Korean BBQ Beef Steamed Bao','소갈비 찐빵 · 고추장-호이신 · 절임 오이'],['🥗','Rice Noodle Salad','다이콘 · 당근 · 고수 · 칠리 · 아가베-라임 드레싱'],['🍜','Wonton Soup','부드러운 치킨 만두 · 닭국물 · 생강 · 나파배추']],Entrées:[['🍤','Laksa Lemak ⭐','새우 · 타우 폭 · 락사 잎 · 칠리 · 싱가포르 시그니처'],['🐚','Pan-seared Pacific Scallops','트러플 버섯 리조또 · 헤이즐넛 · 레몬 오일'],['🍗','Hainanese Chicken Rice ⭐','진간장 · 진저-갈릭 · 칠리 소스'],['🐟','Banana Leaf Steamed Salmon','찐 흰밥 · 청경채']],Desserts:[['🍰','Salted Caramel Cheesecake','바닐라 치즈케이크 · 둘세 데 레체'],['🍫','Chocolate Decadence','비터 초콜릿 크렘 · 트러플 크렘']]},kids:{Starters:[['🥣','Creamed Potato Soup','당근 · 셀러리'],['🥗','Garden Salad','혼합 야채 · 드레싱 선택']],Entrées:[['🍱','Chicken Katsu','코코넛 라이스 · 돈가스 소스'],['🍕','Hawaiian Barbecue Chicken Pizza','사이드 선택'],['🍔','Mini Cheeseburger','브리오슈 번 · 사이드 선택']],Desserts:[['🍫','Chocolate Dome','초콜릿 무스 · 브라우니']]}},n={animators_palate:["Animator's Palate",'Deck 5 AFT · Dinner'],animators_palate_day4:['마지막날 특별 디너','마지막날 특별 디너'],animators_table_breakfast:["Animator's Table · Breakfast",'Deck 9 AFT'],animators_table_lunch:["Animator's Table · Lunch",'Deck 9 AFT'],pixar_market:['Pixar Market Restaurant','Deck 17 AFT'],mowgli_eatery:["Mowgli's Eatery",'Deck 10 MID'],room_service:['Room Service','객실 · 24시간']};let tab='adult';function render(){let x=n[key]||['메뉴 상세','항해 일정에 따라 달라질 수 있습니다'];title.textContent=x[0];sub.textContent=x[1];content.innerHTML=Object.entries(d[tab]).map(([c,a])=>`<section class="section"><h2>${c}</h2>${a.map(([e,m,z])=>`<article class="dish"><div class="emoji">${e}</div><div><div class="name">${m}</div><div class="desc">${z}</div>${m.includes('⭐')?'<span class="sig">추천 메뉴</span>':''}</div></article>`).join('')}</section>`).join('')+'<aside class="note">알레르기·식단 요청은 주문 전 서버에게 알려 주세요. 실제 메뉴는 Navigator 앱에서 확인하세요.</aside>'}document.querySelector('.tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()}};render();</script></body></html>
