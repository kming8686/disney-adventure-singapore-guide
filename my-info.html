<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 일정 · Disney Adventure</title><link rel="stylesheet" href="cruise-theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:#13233e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:430px;min-height:100vh;margin:auto;background:#f8fbfd}.head{padding:18px;color:#fff;background:linear-gradient(135deg,#102c5b,#2873be)}.back{color:#fff;text-decoration:none;font-size:25px}.head h1{font-family:Georgia,serif;font-size:29px;margin:7px 0 3px}.head p{font-size:12px;margin:0;opacity:.9}.settings{display:grid;grid-template-columns:1fr;gap:10px;padding:12px;background:#fff;border-bottom:1px solid #dbe6ef}.settings label{display:block;min-width:0;font-size:11px;font-weight:800;color:#315f9c}.settings input,.settings select{display:block;width:100%;max-width:100%;min-width:0;height:40px;margin-top:5px;border:1px solid #bdd2e3;border-radius:9px;padding:0 10px;font-size:14px}@media(min-width:390px){.settings{grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr)}}.source-note{margin:10px 12px 0;padding:9px 11px;border-radius:10px;background:#fff6d8;border:1px solid #ead99a;color:#6f5815;font-size:10px;line-height:1.5}.tabs{display:flex;gap:7px;padding:11px 10px;overflow:auto;background:#eef4f8;position:sticky;top:0;z-index:4}.tab{white-space:nowrap;border:1px solid #bdd3e6;background:#fff;color:#315f9c;border-radius:99px;padding:8px 12px;font-weight:800}.tab.active{background:#102c5b;color:#fff}.content{padding:0 12px 90px}.day-head{display:flex;justify-content:space-between;align-items:end;margin:5px 2px 10px}.day-head h2{font-size:20px;margin:0}.date{font-size:11px;color:#68788b}.empty{padding:30px 15px;text-align:center;background:#fff;border:1px dashed #b8cddd;border-radius:14px;color:#748397;font-size:12px}.event{display:grid;grid-template-columns:62px 1fr auto;gap:9px;align-items:start;margin:8px 0;padding:12px;background:#fff;border:1px solid #dbe7ef;border-radius:14px}.time{font-size:13px;font-weight:900;color:#1768b4}.event h3{font-size:14px;margin:0 0 4px}.meta{font-size:11px;color:#697b8e;line-height:1.45}.pin{color:#1768b4;text-decoration:none;font-weight:800}.delete{border:0;background:#f5e8e8;color:#a43e3e;border-radius:8px;width:29px;height:29px}.add{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(390px,calc(100% - 28px));height:48px;border:0;border-radius:13px;background:#e1ac25;color:#102c5b;font-weight:900;font-size:14px}.modal{position:fixed;inset:0;display:none;align-items:end;justify-content:center;background:#102c5b66;z-index:10}.modal.show{display:flex}.sheet{width:min(430px,100%);max-height:88vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom));background:#fff;border-radius:22px 22px 0 0}.sheet h2{margin:0 0 5px}.sheet-sub{margin:0 0 12px;color:#66788c;font-size:11px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}.mode button{height:38px;border:1px solid #bfd3e5;border-radius:9px;background:#fff;color:#315f9c;font-weight:800}.mode button.active{background:#102c5b;color:#fff}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.filter{white-space:nowrap;border:1px solid #d2deea;background:#f8fbfe;border-radius:99px;padding:6px 9px;font-size:11px}.filter.active{background:#dff2fa;color:#0d6683;border-color:#7ecbde}.preset-list{display:grid;gap:7px}.preset{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid #dbe6ef;background:#fff;border-radius:11px;padding:10px}.preset-time{font-size:12px;font-weight:900;color:#1768b4}.preset-title{font-size:12px;font-weight:850}.preset-meta{display:block;margin-top:2px;color:#6a7b8d;font-size:10px}.preset-add{font-size:20px;color:#13749a}.manual{display:none}.manual.show{display:block}.fields{display:grid;gap:10px}.fields label{font-size:11px;font-weight:800;color:#315f9c}.fields input,.fields textarea{width:100%;margin-top:5px;border:1px solid #bfd2e2;border-radius:8px;padding:9px;font:inherit}.fields textarea{height:70px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}.actions button,.done,.return-btn{height:42px;border:0;border-radius:9px;font-weight:900}.cancel{background:#edf1f5;color:#596b7d}.save,.done{background:#102c5b;color:#fff}.done{position:sticky;bottom:0;width:100%;margin-top:12px}.save-result{display:none;text-align:center;padding:22px 8px 6px}.save-result.show{display:block}.save-result strong{display:block;font-size:18px;margin-bottom:8px}.save-result p{font-size:12px;color:#66788c}.return-btn{width:100%;margin-top:10px;background:#e1ac25;color:#102c5b}
</style></head>
<body><main class="page"><header class="head"><a class="back" onclick="if(history.length>1){history.back();return false}" href="index.html">‹</a><h1>My Schedule</h1><p>항해 일자별 나만의 일정을 계획하세요.</p></header><section class="settings"><label>출항일<input id="sail" type="date"></label><label>항해 기간<select id="nights"><option value="3">3박 4일</option><option value="4">4박 5일</option></select></label></section><p class="source-note">추천 일정은 업로드한 선내 일정표를 참고한 예시입니다. 실제 일정은 Navigator 앱에서 다시 확인하세요.</p><nav id="tabs" class="tabs"></nav><section id="content" class="content"></section><button class="add" onclick="openPicker()">＋ 일정 추가</button></main>
<div id="modal" class="modal" onclick="if(event.target===this)closePicker()"><section class="sheet"><div id="pickerBody"><h2>Day <span id="pickerDay"></span> 일정 추가</h2><p class="sheet-sub">추천 일정에서 골라 담거나 직접 입력하세요.</p><div class="mode"><button id="presetMode" class="active" onclick="setMode('preset')">추천 일정</button><button id="manualMode" onclick="setMode('manual')">직접 입력</button></div><div id="presetPane"><div id="filters" class="filters"></div><div id="presetList" class="preset-list"></div><button class="done" onclick="closePicker()">선택 완료</button></div><form id="form" class="manual"><div class="fields"><label>시간<input id="time" type="time" required></label><label>일정 이름<input id="title" required></label><label>장소<input id="place"></label><label>메모<textarea id="memo"></textarea></label></div><div class="actions"><button type="button" class="cancel" onclick="closePicker()">취소</button><button class="save">저장</button></div></form></div><div id="saveResult" class="save-result"><strong>✓ 일정이 저장되었습니다.</strong><p>선택한 날짜의 내 일정에서 확인할 수 있습니다.</p><button class="return-btn" onclick="returnToSchedule()">← 일정으로 돌아가기</button></div></section></div>
<script>
const KEY='disneyAdventureSchedule',VOYAGE='disneyAdventureVoyage';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),voyage=JSON.parse(localStorage.getItem(VOYAGE)||'{}'),day=1,category='전체';
const presets={1:[['12:00','Youth Activities Open House','Disney’s Oceaneer Club','키즈'],['13:15','Let’s Set Sail','Garden Stage','공연'],['14:00','Let’s Set Sail','Garden Stage','공연'],['14:45','Let’s Set Sail','Garden Stage','공연'],['16:00','Mandatory Guest Assembly Drill','Disney Adventure','필수'],['16:30','Youth Activities Open House','Disney’s Oceaneer Club','키즈'],['17:15','A Whole New World with Alona','Town Square','음악'],['18:00','Baymax Super Exercise Expo','Garden Stage','공연'],['18:00','Seas the Adventure','Walt Disney Theatre','공연'],['20:30','Seas the Adventure','Walt Disney Theatre','공연'],['20:30','Baymax Super Exercise Expo','Garden Stage','공연'],['21:15','Silent Disco Party','Garden Stage','파티'],['22:30','Family Dance Party','Town Square','파티']],2:[['08:30','Moana: Call of the Sea','Wayfinder Bay','공연'],['09:00','Youth Activities Open House','Mickey & Minnie Captain’s Deck','키즈'],['09:30','Crafts: Family Crafts','Animator’s Palate','체험'],['10:00','Character Appearance: Disney Pals','Garden Stage','캐릭터'],['10:30','Lion King: Celebration in the Sky','Fireworks Viewing Upper Decks','공연'],['11:30','Character Appearance: Disney Pals','Garden Stage','캐릭터'],['13:00','Family Movie Fun Time','Baymax Cinema','영화'],['14:00','Seas the Adventure','Walt Disney Theatre','공연'],['15:00','Youth Activities Open House','it’s a small world nursery','키즈'],['15:30','Family Superstar Karaoke','D Lounge','파티'],['18:00','Seas the Adventure','Walt Disney Theatre','공연'],['20:30','Seas the Adventure','Walt Disney Theatre','공연'],['21:45','Family Superstar Karaoke','D Lounge','파티'],['22:30','Around the World Party with DJ DEE','Garden Stage','파티']],3:[['09:00','Duffy and the Friend Ship','Walt Disney Theatre','공연'],['09:00','Youth Activities Open House','Marvel W.E.B. Workshop','키즈'],['09:30','Moana: Call of the Sea','Wayfinder Bay','공연'],['10:00','Duffy and the Friend Ship','Walt Disney Theatre','공연'],['10:30','Moana: Call of the Sea','Wayfinder Bay','공연'],['11:00','Duffy and the Friend Ship','Walt Disney Theatre','공연'],['13:00','Learn to Draw','Animator’s Palate','체험'],['15:00','Youth Activities Open House','Disney’s Oceaneer Club','키즈'],['15:30','Family Superstar Karaoke','D Lounge','파티'],['18:00','Remember','Walt Disney Theatre','공연'],['18:15','Avengers Assemble!','Garden Stage','공연'],['20:30','Remember','Walt Disney Theatre','공연'],['20:45','Avengers Assemble!','Garden Stage','공연'],['21:30','Disney Tunes Trivia','D Lounge','게임']],4:[['09:00','Youth Activities Open House','Mickey & Minnie Captain’s Deck','키즈'],['09:15','Baymax Super Exercise Expo','Garden Stage','공연'],['10:30','Mickey’s Color Spin Dance Party','Garden Stage','공연'],['13:00','Jack-Jack’s Diaper Dash','Town Square','공연'],['14:00','Remember','Walt Disney Theatre','공연'],['15:00','Family Superstar Karaoke','D Lounge','파티'],['15:15','Youth Activities Open House','Disney’s Oceaneer Club','키즈'],['18:00','Remember','Walt Disney Theatre','공연'],['18:15','Jack-Jack’s Diaper Dash','Town Square','공연'],['20:30','Remember','Walt Disney Theatre','공연'],['20:45','Avengers Assemble!','Garden Stage','공연'],['21:15','Mozart-Puccini with Alona','Garden Stage','음악'],['22:15','Once Upon an Eastern Dream with Lucy','Town Square','음악']],5:[]};
const sail=document.getElementById('sail'),nights=document.getElementById('nights');sail.value=voyage.sail||'2026-07-30';nights.value=voyage.nights||'4';function days(){return Number(nights.value)+1}function dateFor(d){if(!sail.value)return'';const x=new Date(sail.value+'T00:00:00');x.setDate(x.getDate()+d-1);return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(x)}function saveVoyage(){voyage={...voyage,sail:sail.value,nights:nights.value};localStorage.setItem(VOYAGE,JSON.stringify(voyage));if(day>days())day=days();render()}sail.onchange=nights.onchange=saveVoyage;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){tabs.innerHTML=Array.from({length:days()},(_,i)=>`<button class="tab ${day===i+1?'active':''}" onclick="day=${i+1};render()">Day ${i+1}</button>`).join('');const items=(data[day]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));content.innerHTML=`<div class="day-head"><h2>Day ${day}</h2><span class="date">${dateFor(day)}</span></div>`+(items.length?items.map((e,i)=>`<article class="event"><div class="time">${e.time}</div><div><h3>${esc(e.title)}</h3><div class="meta">${e.place?`<a class="pin" href="deck-plan.html?q=${encodeURIComponent(e.place)}">📍 ${esc(e.place)}</a><br>`:''}${e.memo?esc(e.memo):''}</div></div><button class="delete" onclick="removeItem(${i})">×</button></article>`).join(''):'<div class="empty">아직 등록된 일정이 없습니다.<br>아래의 ‘일정 추가’ 버튼을 눌러 추천 일정에서 선택하세요.</div>')}
function openPicker(){pickerDay.textContent=day;category='전체';pickerBody.style.display='block';saveResult.classList.remove('show');setMode('preset');renderPresets();modal.classList.add('show')}function closePicker(){modal.classList.remove('show')}function setMode(mode){presetMode.classList.toggle('active',mode==='preset');manualMode.classList.toggle('active',mode==='manual');presetPane.style.display=mode==='preset'?'block':'none';form.classList.toggle('show',mode==='manual');if(mode==='manual'){form.reset();time.value='09:00';title.focus()}}
function renderPresets(){const list=(presets[day]||[]).slice().sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1]));const cats=['전체',...new Set(list.map(x=>x[3]))];filters.innerHTML=cats.map(c=>`<button class="filter ${c===category?'active':''}" onclick="category='${c}';renderPresets()">${c}</button>`).join('');const shown=(category==='전체'?list:list.filter(x=>x[3]===category)).slice().sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1]));presetList.innerHTML=shown.length?shown.map(x=>`<button class="preset" onclick="addPreset('${x[0]}','${x[1].replace(/'/g,"\\'")}','${x[2].replace(/'/g,"\\'")}','${x[3]}')"><span class="preset-time">${x[0]}</span><span><span class="preset-title">${x[1]}</span><span class="preset-meta">📍 ${x[2]} · ${x[3]}</span></span><span class="preset-add">＋</span></button>`).join(''):'<div class="empty">이 날짜에는 등록된 추천 일정이 없습니다.</div>'}
function showSaved(){pickerBody.style.display='none';saveResult.classList.add('show')}function returnToSchedule(){closePicker();render();window.scrollTo({top:document.querySelector('.day-head').offsetTop-70,behavior:'smooth'})}
function addPreset(t,n,p,type){if((data[day]||[]).some(e=>e.time===t&&e.title===n)){alert('이미 추가된 일정입니다.');return}(data[day]||(data[day]=[])).push({time:t,title:n,place:p,memo:type});localStorage.setItem(KEY,JSON.stringify(data));render();showSaved()}
form.onsubmit=e=>{e.preventDefault();(data[day]||(data[day]=[])).push({time:time.value,title:title.value,place:place.value,memo:memo.value});localStorage.setItem(KEY,JSON.stringify(data));render();showSaved()};function removeItem(index){const sorted=(data[day]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time)),target=sorted[index],raw=data[day]||[],real=raw.indexOf(target);if(real>=0)raw.splice(real,1);localStorage.setItem(KEY,JSON.stringify(data));render()}render();
</script></body></html>
