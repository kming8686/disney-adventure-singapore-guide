<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>내 일정 · Disney Adventure</title><link rel="stylesheet" href="cruise-theme.css"><style>*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:#13233e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:430px;min-height:100vh;margin:auto;background:#f8fbfd}.head{padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,#102c5b,#2873be)}.back{color:#fff;text-decoration:none;font-size:25px}.head h1{font-family:Georgia,serif;font-size:29px;margin:7px 0 3px}.head p{font-size:12px;margin:0;opacity:.9}.settings{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px;background:#fff;border-bottom:1px solid #dbe6ef}.settings label{display:block;min-width:0;font-size:10px;font-weight:800;color:#315f9c}.settings input,.settings select{display:block;width:100%;min-width:0;max-width:100%;height:40px;margin-top:4px;border:1px solid #bdd2e3;border-radius:8px;padding:0 10px;font-size:14px}.tabs{display:flex;gap:7px;padding:11px 10px;overflow:auto;background:#eef4f8;position:sticky;top:0;z-index:4}.tab{white-space:nowrap;border:1px solid #bdd3e6;background:#fff;color:#315f9c;border-radius:99px;padding:8px 12px;font-weight:800}.tab.active{background:#102c5b;color:#fff}.content{padding:0 12px 90px}.day-head{display:flex;justify-content:space-between;align-items:end;margin:5px 2px 10px}.day-head h2{font-size:20px;margin:0}.date{font-size:11px;color:#68788b}.empty{padding:30px 15px;text-align:center;background:#fff;border:1px dashed #b8cddd;border-radius:14px;color:#748397;font-size:12px}.event{display:grid;grid-template-columns:62px 1fr auto;gap:9px;align-items:start;margin:8px 0;padding:12px;background:#fff;border:1px solid #dbe7ef;border-radius:14px}.time{font-size:13px;font-weight:900;color:#1768b4}.event h3{font-size:14px;margin:0 0 4px}.meta{font-size:11px;color:#697b8e;line-height:1.45}.pin{color:#1768b4;text-decoration:none;font-weight:800}.delete{border:0;background:#f5e8e8;color:#a43e3e;border-radius:8px;width:29px;height:29px}.add{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(390px,calc(100% - 28px));height:48px;border:0;border-radius:13px;background:#e1ac25;color:#102c5b;font-weight:900;font-size:14px}.modal{position:fixed;inset:0;display:none;align-items:end;justify-content:center;background:#102c5b66;z-index:10}.modal.show{display:flex}.form{width:min(430px,100%);padding:18px 18px calc(22px + env(safe-area-inset-bottom));background:#fff;border-radius:22px 22px 0 0}.form h2{margin:0 0 13px}.fields{display:grid;gap:10px}.fields label{font-size:11px;font-weight:800;color:#315f9c}.fields input,.fields textarea{width:100%;margin-top:5px;border:1px solid #bfd2e2;border-radius:8px;padding:9px;font:inherit}.fields textarea{height:70px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}.actions button{height:42px;border:0;border-radius:9px;font-weight:900}.cancel{background:#edf1f5;color:#596b7d}.save{background:#102c5b;color:#fff}@media(min-width:390px){.settings{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:10px}}</style></head><body><main class="page"><header class="head"><a class="back" onclick="if(history.length>1){history.back();return false}" href="index.html">‹</a><h1>My Schedule</h1><p>항해 일자별 나만의 일정을 계획하세요.</p></header><section class="settings"><label>출항일<input id="sail" type="date"></label><label>항해 기간<select id="nights"><option value="3">3박 4일</option><option value="4">4박 5일</option></select></label></section><nav id="tabs" class="tabs"></nav><section id="content" class="content"></section><button class="add" onclick="openForm()">＋ 일정 추가</button></main><div id="modal" class="modal" onclick="if(event.target===this)closeForm()"><form id="form" class="form"><h2>일정 추가</h2><div class="fields"><label>시간<input id="time" type="time" required></label><label>일정 이름<input id="title" placeholder="예: Remember 공연" required></label><label>장소<input id="place" placeholder="예: Walt Disney Theatre"></label><label>메모<textarea id="memo" placeholder="예약 번호, 준비물 등을 적어두세요."></textarea></label></div><div class="actions"><button type="button" class="cancel" onclick="closeForm()">취소</button><button class="save">저장</button></div></form></div><script>const KEY='disneyAdventureSchedule',VOYAGE='disneyAdventureVoyage';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),voyage=JSON.parse(localStorage.getItem(VOYAGE)||'{}'),day=1;const sail=document.getElementById('sail'),nights=document.getElementById('nights');sail.value=voyage.sail||'2026-07-30';nights.value=voyage.nights||'4';function days(){return Number(nights.value)+1}function dateFor(d){if(!sail.value)return'';const x=new Date(sail.value+'T00:00:00');x.setDate(x.getDate()+d-1);return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(x)}function saveVoyage(){voyage={...voyage,sail:sail.value,nights:nights.value};localStorage.setItem(VOYAGE,JSON.stringify(voyage));if(day>days())day=days();render()}sail.onchange=nights.onchange=saveVoyage;function render(){tabs.innerHTML=Array.from({length:days()},(_,i)=>`<button class="tab ${day===i+1?'active':''}" onclick="day=${i+1};render()">Day ${i+1}</button>`).join('');const items=(data[day]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));content.innerHTML=`<div class="day-head"><h2>Day ${day}</h2><span class="date">${dateFor(day)}</span></div>`+(items.length?items.map((e,i)=>`<article class="event"><div class="time">${e.time}</div><div><h3>${esc(e.title)}</h3><div class="meta">${e.place?`<a class="pin" href="deck-plan.html?q=${encodeURIComponent(e.place)}">📍 ${esc(e.place)}</a><br>`:''}${e.memo?esc(e.memo):''}</div></div><button class="delete" onclick="removeItem(${i})">×</button></article>`).join(''):'<div class="empty">아직 등록된 일정이 없습니다.<br>아래의 ‘일정 추가’ 버튼을 눌러 계획을 시작하세요.</div>')}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openForm(){form.reset();time.value='09:00';modal.classList.add('show');title.focus()}function closeForm(){modal.classList.remove('show')}form.onsubmit=e=>{e.preventDefault();(data[day]||(data[day]=[])).push({time:time.value,title:title.value,place:place.value,memo:memo.value});localStorage.setItem(KEY,JSON.stringify(data));closeForm();render()};function removeItem(index){const sorted=(data[day]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time)),target=sorted[index],raw=data[day]||[],real=raw.indexOf(target);if(real>=0)raw.splice(real,1);localStorage.setItem(KEY,JSON.stringify(data));render()}render();</script></body></html>
