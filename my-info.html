<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 정보</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#13233e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:430px;min-height:100vh;margin:auto;background:#fff}.head{padding:18px;color:#fff;background:linear-gradient(135deg,#102c5b,#2873be)}.back{color:#fff;text-decoration:none;font-size:24px}.head h1{font-family:Georgia,serif;font-size:28px;margin:6px 0 2px}.head p{font-size:12px;margin:0;opacity:.9}.form{display:grid;gap:14px;padding:18px}.field label{display:block;font-size:12px;font-weight:900;color:#315f9c;margin-bottom:6px}.field input,.field select{width:100%;height:42px;border:1px solid #cad8e7;border-radius:8px;padding:0 10px;font-size:14px;background:#fff}.save{border:0;border-radius:10px;background:#e1ac25;color:#102c5b;height:45px;font-weight:900;font-size:14px}.status{display:none;margin:0 18px;padding:10px;background:#e6f6ed;color:#22613f;border-radius:9px;font-size:12px}.hint{margin:0 18px;padding:12px;border-radius:10px;background:#fff5d8;color:#71580f;font-size:12px;line-height:1.5}</style></head><body><main class="page"><header class="head"><a class="back" onclick="if(history.length>1){history.back();return false}" href="disney-adventure-singapore-guide.html">‹</a><h1>My Voyage</h1><p>항해 정보를 저장하면 내 일정의 기준으로 사용됩니다.</p></header><p class="hint">객실 번호와 항해 정보를 저장하면 레스토랑·공연·내 일정 페이지에서 같은 정보를 불러옵니다. 실제 운항 시간은 Navigator 앱에서 최종 확인하세요.</p><p id="status" class="status">저장되었습니다.</p><form id="form" class="form"><div class="field"><label>객실 번호</label><input id="room" inputmode="numeric" maxlength="5" placeholder="예: 11129"></div><div class="field"><label>출항일</label><input id="sail" type="date"></div><div class="field"><label>항해 기간</label><select id="nights"><option value="3">3박 4일</option><option value="4">4박 5일</option></select></div><div class="field"><label>첫 디너 식당</label><select id="dinner"><option value="Animator's Palate">Animator's Palate</option><option value="Animator's Table">Animator's Table</option><option value="Enchanted Summer Restaurant">Enchanted Summer Restaurant</option><option value="Navigators Club">Navigators Club</option><option value="Hollywood Spotlight Club">Hollywood Spotlight Club</option><option value="Pixar Market Restaurant">Pixar Market Restaurant</option></select></div><button class="save">항해 정보 저장</button></form></main><script>const k='disneyAdventureVoyage',d=JSON.parse(localStorage.getItem(k)||'{}');room.value=d.room||'';sail.value=d.sail||'';nights.value=d.nights||'4';dinner.value=d.dinner||"Animator's Palate";form.onsubmit=e=>{e.preventDefault();localStorage.setItem(k,JSON.stringify({room:room.value,sail:sail.value,nights:nights.value,dinner:dinner.value}));status.style.display='block'};</script></body></html>
