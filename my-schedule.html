<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Disney Adventure · 내 일정</title><style>
:root{--navy:#102c5b;--blue:#1569ca;--ink:#13233e;--muted:#64738d;--line:#dbe7ef;--gold:#e1ac25}*{box-sizing:border-box}body{margin:0;background:#eff5fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:430px;min-height:100vh;margin:auto;background:#fbfdff}.head{padding:18px;color:#fff;background:linear-gradient(145deg,#0c2355,#1262b9 65%,#50b6d8)}.back{color:#fff;text-decoration:none;font-size:26px}.head h1{margin:8px 0 3px;font-family:Georgia,serif;font-size:29px}.head p{margin:0;font-size:12px;opacity:.9}.summary{margin:10px 8px;padding:12px;border:1px solid #d8e7f3;border-radius:12px;background:#fff;box-shadow:0 4px 12px #1b4d7f0d}.summary b{font-size:13px}.summary p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.5}.tabs{display:flex;gap:6px;overflow:auto;padding:4px 8px 10px}.tab{flex:0 0 auto;border:1px solid #cbddec;border-radius:10px;background:#fff;padding:8px 12px;color:#526887;font-size:11px;font-weight:800}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.list{display:grid;gap:8px;padding:0 8px 10px}.empty{padding:28px 12px;border:1px dashed #bdd2e3;border-radius:12px;color:#738198;text-align:center;font-size:12px}.event{display:grid;grid-template-columns:48px 1fr 23px;gap:9px;align-items:start;padding:10px;border:1px solid #dce8f1;border-radius:12px;background:#fff;box-shadow:0 3px 10px #1a4a7e0c}.event.done{opacity:.55}.time{color:#1768b4;font-size:12px;font-weight:900;padding-top:3px}.kind{display:inline-block;margin-bottom:3px;border-radius:99px;background:#eaf4ff;color:#2766a1;padding:2px 6px;font-size:9px;font-weight:900}.event h3{margin:0;font-size:13px}.event p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.4}.event p a{color:#19788c;text-decoration:none;font-weight:800}.check{appearance:none;width:20px;height:20px;margin:2px 0 0;border:2px solid #a7c2d8;border-radius:50%;cursor:pointer}.check:checked{border-color:#48a46d;background:#48a46d;box-shadow:inset 0 0 0 4px #fff}.add{margin:0 8px 18px;border:0;border-radius:12px;width:calc(100% - 16px);height:44px;background:var(--gold);color:var(--navy);font-size:13px;font-weight:900}.dialog{position:fixed;inset:0;display:none;align-items:end;justify-content:center;background:#0b254966;z-index:3}.dialog.show{display:flex}.form{width:min(430px,100%);padding:17px 16px calc(17px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:#fff}.form h2{margin:0 0 13px;font-size:18px}.row{display:flex;gap:8px}.field{display:grid;gap:4px;margin-bottom:10px;flex:1}.field label{font-size:10px;font-weight:900;color:#476687}.field input,.field select{width:100%;height:39px;border:1px solid #cbdceb;border-radius:8px;padding:0 9px;font:inherit;font-size:12px}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:9px;height:42px;font-weight:900}.cancel{background:#edf3f8;color:#60728b}.save{background:var(--navy);color:#fff}</style></head><body><main class="page"><header class="head"><a class="back" onclick="if(history.length>1){history.back();return false}" href="disney-adventure-singapore-guide.html">‹</a><h1>My Schedule</h1><p>나만의 Disney Adventure 일정</p></header><section class="summary" id="summary"></section><div class="tabs" id="tabs"></div><section class="list" id="list"></section><button class="add" id="add">＋ 일정 추가</button></main><div class="dialog" id="dialog"><form class="form" id="form"><h2>일정 추가</h2><div class="row"><div class="field"><label>시간</label><input id="time" type="time" required></div><div class="field"><label>분류</label><select id="kind"><option>개인 일정</option><option>식사</option><option>공연</option><option>액티비티</option><option>예약</option></select></div></div><div class="field"><label>일정명</label><input id="title" maxlength="50" placeholder="예: 캐릭터 그리팅" required></div><div class="field"><label>장소 / 메모</label><input id="place" maxlength="80" placeholder="예: Garden Stage"></div><div class="actions"><button class="cancel" type="button" id="cancel">취소</button><button class="save">저장</button></div></form></div><script>
const voyage=JSON.parse(localStorage.getItem('disneyAdventureVoyage')||'{}'),key='disneyAdventureSchedule',doneKey='disneyAdventureScheduleDone',custom=JSON.parse(localStorage.getItem(key)||[]),done=JSON.parse(localStorage.getItem(doneKey)||'{}');let day=1;const count=+(voyage.nights||4)+1;
const summaryEl=document.getElementById('summary'),tabsEl=document.getElementById('tabs'),listEl=document.getElementById('list'),addButton=document.getElementById('add'),dialogEl=document.getElementById('dialog'),formEl=document.getElementById('form'),timeInput=document.getElementById('time'),kindInput=document.getElementById('kind'),titleInput=document.getElementById('title'),placeInput=document.getElementById('place'),cancelButton=document.getElementById('cancel');
function date(n){if(!voyage.sail)return '';const d=new Date(voyage.sail+'T00:00:00');d.setDate(d.getDate()+n-1);return (d.getMonth()+1)+'/'+d.getDate()}
function defaults(n){const a=[];if(n===1){a.push({id:'muster',time:'4:00 PM – 4:30 PM',kind:'필수 일정',title:'🎉 Guest Muster Drill (안전교육)',place:'Disney Adventure'});a.push({id:'greeting',time:'4:30 PM',kind:'직접 추가',title:'📝 그리팅 예약',place:'직접 추가'})}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function loc(s){const t=esc(s);return /deck|stage|bay|lounge|club|restaurant|spa|pool|theatre|court/i.test(s)?'<a href="deck-plan.html?q='+encodeURIComponent(s)+'">📍 '+t+' · 위치 보기</a>':t}
function render(){summaryEl.innerHTML='<b>📅 '+(voyage.sail?esc(voyage.sail)+' 출항 일정':'5/21 ~ 5/24 스케줄 보기')+'</b><p>Day '+day+' · 총 156개</p>';tabsEl.innerHTML='';for(let i=1;i<=count;i++){const b=document.createElement('button');b.className='tab '+(day===i?'active':'');b.textContent='DAY '+i+(date(i)?' · '+date(i):'');b.onclick=()=>{day=i;render()};tabsEl.append(b)}const items=[...defaults(day),...custom.filter(x=>x.day===day)].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));listEl.innerHTML=items.length?items.map(e=>'<article class="event '+(done[e.id]?'done':'')+'"><div class="time">'+(e.time||'시간 미정')+'</div><div><span class="kind">'+esc(e.kind)+'</span><h3>'+esc(e.title)+'</h3>'+(e.place?'<p>'+loc(e.place)+'</p>':'')+'</div><input class="check" type="checkbox" '+(done[e.id]?'checked ':'')+'data-id="'+e.id+'"></article>').join(''):'<div class="empty">아직 추가한 일정이 없습니다.<br>아래 버튼으로 나만의 일정을 만들어 보세요.</div>';listEl.querySelectorAll('.check').forEach(c=>c.onchange=()=>{done[c.dataset.id]=c.checked;localStorage.setItem(doneKey,JSON.stringify(done));render()})}
addButton.onclick=()=>{dialogEl.classList.add('show');timeInput.focus()};cancelButton.onclick=()=>{dialogEl.classList.remove('show');formEl.reset()};formEl.onsubmit=e=>{e.preventDefault();custom.push({id:crypto.randomUUID(),day:day,time:timeInput.value,kind:kindInput.value,title:titleInput.value.trim(),place:placeInput.value.trim(),done:false});localStorage.setItem(key,JSON.stringify(custom));dialogEl.classList.remove('show');formEl.reset();render()};render();
</script></body></html>
